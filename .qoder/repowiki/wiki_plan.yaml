    - text: >-
        以 Admin.NET/Admin.NET.Core/、Admin.NET/Admin.NET.Application/、Admin.NET/Admin.NET.Web.Core/ 和 Admin.NET/Admin.NET.Web.Entry/ 的职责分层组织后端知识，再按实际功能细分。
    - text: >-
        区分 Web/apps/web-antdv-next/ 的业务适配、Web/packages/ 的共享能力和 Web/internal/ 的工具配置。
        保留 @vben/* 包名与上游归属，不将共享框架实现全部归为本项目业务代码。
    - text: >-
        将 Admin.NET/Plugins/ 视为可选集成，是否启用须核对项目引用与运行配置。
        将 Admin.NET/Admin.NET.Test/ 的知识归入测试与验证职责。
