.inspector-switch button{flex:1;min-width:0;height:34px;font-size:12px;color:var(--muted)}
.inspector-switch button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #172c4815;color:var(--blue);font-weight:650}
.inspector-switch .icon{width:15px;height:15px}.right .panel-tabs{padding-top:10px}
.property-body.doc-config{padding:16px 15px;display:block}
.config-intro{padding:12px;background:var(--blue-soft);border:1px solid #dce6ff;border-radius:6px;margin-bottom:14px}
.config-intro strong{display:flex;align-items:center;gap:8px;font-size:13px;color:#234a9c;margin-bottom:5px}
.config-intro p{font-size:11px;line-height:1.7;color:#52698d}
.config-section{border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:14px}
.config-section summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;min-height:34px;font-size:12px;font-weight:650}
.config-section summary::-webkit-details-marker{display:none}.config-section summary:after{content:'＋';margin-left:auto;color:#77859b;font-size:14px}.config-section[open] summary:after{content:'−'}
.config-number{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;background:#edf1f7;color:#526782;font-size:10px;font-weight:500}
.config-fields{display:grid;gap:12px;padding-top:8px}.config-fields label{display:block;font-size:11px;color:#526079;margin-bottom:6px}
.config-fields input,.config-fields select{height:34px;font-size:12px}.config-fields input[aria-invalid=true]{border-color:#c34444;background:#fff8f8}
.config-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.config-example{background:#f7f9fc;border:1px solid var(--line);border-radius:5px;padding:10px 11px}
.config-example span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.config-example strong{font:600 13px Consolas,monospace;color:#31558c;overflow-wrap:anywhere}
.config-help{font-size:11px;color:#697b91;line-height:1.7}.config-errors{font-size:11px;color:#b43e3e;line-height:1.7}.config-errors:empty{display:none}
.operation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.operation-choice{display:flex!important;align-items:center;gap:5px;border:1px solid #dde4ee;border-radius:5px;padding:8px 6px;margin:0!important;cursor:pointer;background:#fff;font-size:11px!important;color:#43546c!important}
.operation-choice:has(input:checked){border-color:#c7d6fb;background:#f5f8ff;color:#2458d3!important}.operation-choice input{appearance:auto;width:13px;height:13px;margin:0;accent-color:var(--blue);padding:0;flex:none}
.config-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}.config-toggle>label{margin:0;font-size:12px;color:var(--ink)}
.config-toggle input{width:16px;height:16px;accent-color:var(--blue);padding:0}
.runtime-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:0 0 15px;margin-top:-3px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.runtime-caption{font-size:10px;color:var(--muted);padding-right:6px}.runtime-chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:4px 9px;border:1px solid #dce4ef;border-radius:4px;font-size:11px;background:#fff;color:#52657e}.runtime-chip:first-of-type{color:#2458d3;background:#f1f5ff;border-color:#c9d7f6}
.workflow-strip{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:13px 0 0;padding:10px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:5px;font-size:11px;color:#5d6f87}.workflow-strip strong{font-weight:550;color:#314d70}.workflow-strip i{font-style:normal;color:#9aa8b9}
.paper.compact-print .paper-terms,.paper.compact-print .uppercase-total{display:none}.paper.compact-print .paper-company{font-size:12px}.paper.compact-print{min-height:660px;aspect-ratio:auto}
.config-bottom{display:flex;align-items:flex-start;gap:7px;background:#fafbfc;border-radius:5px;padding:10px;color:#63758b;font-size:11px;line-height:1.7}.config-bottom .icon{width:14px;height:14px;margin-top:2px;flex:none}
.entry-title h2,.doc-identity h1{overflow-wrap:anywhere}.nav-info .mono{overflow-wrap:anywhere}.entry-title .subtitle{flex-wrap:wrap}.entry-code{max-width:180px;overflow-wrap:anywhere;white-space:normal}
@media(min-width:1500px){.workspace{grid-template-columns:246px minmax(0,1fr) 340px}}
@media(min-width:761px) and (max-width:1279px){.workspace{grid-template-columns:194px minmax(0,1fr) 300px}}
@media(min-width:761px) and (max-width:1020px){.workspace{grid-template-columns:168px minmax(0,1fr) 274px}.config-pair{grid-template-columns:1fr}.operation-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.property-body.doc-config{display:block}.config-pair{grid-template-columns:1fr 1fr}.right>.panel-title{position:static}.runtime-actions{gap:5px}.runtime-chip{padding:4px 6px}.config-section summary{min-height:42px}}
@media print{.runtime-actions,.workflow-strip{display:none!important}}

/><path d="M12 11v6M12 7v.1"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol><symbol id="i-delete" viewBox="0 0 24 24"><path d="M3 6h18M9 3h6M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol><symbol id="i-cursor" viewBox="0 0 24 24"><path d="m4 3 6 18 3-7 7-3L4 3z"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5zM3 8l9 5 9-5M12 13v9M7 6l9 5"/></symbol>

<div class="app" id="app">
<header class="topbar">
<div class="brand"><span class="brand-logo"><svg class="icon"><use href="#i-layout"/></svg></span><span>单据设计工作台</span></div><div class="divider"></div>
<div class="doc-identity"><h1 id="documentHeading">采购订单</h1><span class="draft">草稿</span></div><div class="top-spacer"></div><span class="edit-state" id="editState">所有更改仅保留在本次会话</span>
<button class="btn" id="previewButton" aria-pressed="false"><svg class="icon"><use href="#i-eye"/></svg><span>预览</span></button><button class="btn primary" id="saveButton"><svg class="icon"><use href="#i-save"/></svg>保存草稿</button><div class="avatar" title="示例设计人员">林</div>
</header>

<div class="workspace">

<script>
'use strict';
const $ = selector => document.querySelector(selector);
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
// 所有可能来自用户输入的字符串在 HTML 插值前统一转义。
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const catalog = [
{id:'orderNo',label:'单据编号',value:'PO-20261020-001',type:'单行文本',icon:'file',group:'单据基础',required:true,width:'normal'},
{id:'orderDate',label:'单据日期',value:'2026-10-20',type:'日期',icon:'calendar',group:'单据基础',required:true,width:'normal'},
{id:'department',label:'采购部门',value:'生产采购部',type:'关联选择',icon:'building',group:'单据基础',required:true,width:'normal'},
{id:'supplier',label:'供应商',value:'杭州远山机电有限公司',type:'关联选择',icon:'building',group:'业务信息',required:true,width:'wide'},
{id:'buyer',label:'采购员',value:'林晓',type:'人员选择',icon:'user',group:'业务信息',required:false,width:'normal'},
{id:'deliveryDate',label:'交货日期',value:'2026-10-30',type:'日期',icon:'calendar',group:'业务信息',required:true,width:'normal'},
{id:'warehouse',label:'收货仓库',value:'杭州 · 原材料一号仓',type:'关联选择',icon:'box',group:'业务信息',required:false,width:'normal'},
{id:'payment',label:'结算方式',value:'月结 30 天',type:'下拉选择',icon:'text',group:'业务信息',required:false,width:'normal'},
{id:'contact',label:'供应商联系人',value:'陈经理 · 138 0000 2680',type:'单行文本',icon:'user',group:'扩展字段',required:false,width:'normal'},
{id:'address',label:'收货地址',value:'杭州市余杭区文一西路 128 号',type:'单行文本',icon:'building',group:'扩展字段',required:false,width:'wide'},
{id:'remark',label:'采购备注',value:'请随货附出厂检验报告及合格证。',type:'多行文本',icon:'text',group:'扩展字段',required:false,width:'wide'}
];
const rows = [
{name:'深沟球轴承',code:'MAT-10028',spec:'6205-2RS / SKF',unit:'只',qty:24,price:128},
{name:'三相异步电动机',code:'MAT-20106',spec:'YE3-90S-4 / 1.1kW',unit:'台',qty:4,price:1850},
{name:'接近传感器',code:'MAT-30112',spec:'LJ12A3-4-Z/BX',unit:'个',qty:10,price:268}
];
const clone = value => JSON.parse(JSON.stringify(value));
const initialDocument = {name:'采购订单',code:'purchase_order',category:'采购管理',prefix:'PO',dateFormat:'YYYYMMDD',serialLength:3,approval:'single',reviewer:'采购主管',printTemplate:'standard',printCompany:'远川精工制造有限公司',printSignatures:true,operations:['add','edit','delete','query','import','export','print','submit','withdraw','approve','unapprove','void','close']};
const operationOptions = [['add','新增'],['edit','修改'],['delete','删除'],['query','查询'],['import','导入'],['export','导出'],['print','打印'],['submit','提交'],['withdraw','撤回'],['approve','审核'],['unapprove','反审'],['void','作废'],['close','关闭']];
let documentConfig=clone(initialDocument), inspector='document';
let fields = clone(catalog.slice(0,8)), selected = 'supplier', mode = 'entry', preview = false, library = 'fields', propertyTab = 'settings', history = [], toastTimer, customSerial = 1;
const sectionState = {basic:true,number:false,operations:false,approval:false,print:false};
function numberExample(){const date={YYYYMMDD:'20261020',YYYYMM:'202610',none:''}[documentConfig.dateFormat];return [documentConfig.prefix,date,'1'.padStart(documentConfig.serialLength,'0')].filter(Boolean).join('-');}
function syncDocument(){const number=fields.find(f=>f.id==='orderNo');if(number)number.value=numberExample();$('#documentHeading').textContent=documentConfig.name;$('#documentModel').textContent=documentConfig.code+' · v1.0';document.title=documentConfig.name+' · 单据设计工作台';}
function actionMarkup(){return `<div class="runtime-actions" aria-label="已启用操作的外观示例"><span class="runtime-caption">操作栏预览</span>${operationOptions.filter(([key])=>documentConfig.operations.includes(key)).map(([,label])=>`<span class="runtime-chip">${esc(label)}</span>`).join('')||'<span class="config-help">尚未启用业务操作</span>'}</div>`;}
function approvalMarkup(){const names={none:'无需审核',single:'单级审核',multi:'两级审核'};const steps=documentConfig.approval==='none'?['草稿','提交生效']:documentConfig.approval==='single'?['草稿','待审核','已审核']:['草稿','主管审核','负责人审核','已审核'];return `<div class="workflow-strip"><strong>${names[documentConfig.approval]}</strong><span>${steps.map(esc).join('　→　')}</span>${documentConfig.approval==='none'?'':`<i>·</i><span>${esc(documentConfig.reviewer)}${documentConfig.approval==='multi'?' → 部门负责人':''}</span>`}</div>`;}

const money = value => value.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const subtotal = rows.reduce((sum,row) => sum + row.qty * row.price,0), tax = Math.round(subtotal * .13 * 100) / 100, total = subtotal + tax;
function notify(message){ $('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600); }
function snapshot(){history.push({fields:clone(fields),selected,documentConfig:clone(documentConfig)});if(history.length>35)history.shift();}
function changed(){ $('#editState').textContent='有未保存的演示修改';$('#undoButton').disabled=history.length===0; }
function fieldMarkup(field){const hasSuffix=field.type==='日期'?'calendar':field.type.includes('选择')?'down':null;return `<div class="field-node ${field.width==='wide'?'wide':''} ${field.id===selected?'selected':''}" data-field="${esc(field.id)}" ${preview?'':'tabindex="0" role="button"'} aria-label="${esc(field.label)}：${esc(field.value)}${preview?'':'，点击编辑属性'}"><span class="handles" aria-hidden="true"></span><span class="selection-label" aria-hidden="true">${esc(field.type)} · ${esc(field.id)}</span><label>${field.required?'<span class="required">*</span>':''}${esc(field.label)}${mode==='print'?'：':''}</label><div class="field-value"><span>${esc(field.value)||'—'}</span>${hasSuffix?icon(hasSuffix):''}</div></div>`;}
function tableMarkup(){return `<div class="table-wrap"><table aria-label="采购商品明细"><colgroup>${mode==='print'?'<col style="width:6%"><col style="width:24%"><col style="width:23%"><col style="width:7%"><col style="width:9%"><col style="width:14%"><col style="width:17%">':''}</colgroup><thead><tr><th class="row-index">#</th><th>物料名称 / 编码</th><th>规格型号</th><th>单位</th><th class="num">数量</th><th class="num">单价（元）</th><th class="num">金额（元）</th></tr></thead><tbody>${rows.map((row,index)=>`<tr><td class="row-index">${index+1}</td><td>${row.name}<span class="material-code mono">${row.code}</span></td><td>${row.spec}</td><td class="unit">${row.unit}</td><td class="num">${row.qty.toFixed(2)}</td><td class="num">${money(row.price)}</td><td class="num">${money(row.qty*row.price)}</td></tr>`).join('')}</tbody></table><div class="table-foot"><span>共 ${rows.length} 项物料 <span class="muted">· 数量合计 38.00</span></span><span>未税小计 <b>¥ ${money(subtotal)}</b></span></div></div>`;}
function totalMarkup(){return `<div class="totals"><span>未税金额 <b>¥ ${money(subtotal)}</b></span><span>税额（13%）<b>¥ ${money(tax)}</b></span><span class="grand">价税合计 <b>¥ ${money(total)}</b></span></div>`;}
function renderCanvas(){syncDocument();const canvas=$('#canvas');canvas.className='canvas'+(mode==='print'?' paper'+(documentConfig.printTemplate==='compact'?' compact-print':''):'');canvas.style.gap='';canvas.style.fontSize='';const compact=$('#canvasDensity').value==='compact';canvas.style.setProperty('--density',compact?'8px':'12px');
if(mode==='entry'){canvas.innerHTML=`<div class="entry-title"><div><h2>${esc(documentConfig.name)}</h2><div class="subtitle">${esc(documentConfig.category)}<span> / </span>标准业务单据<span> / </span>人民币 CNY</div></div><span class="entry-code mono">${esc(documentConfig.code.toUpperCase())}</span></div>${actionMarkup()}<div class="section-caption">基本信息<span class="section-meta">共享字段 · ${fields.length} 个</span></div><div class="form-grid" style="row-gap:${compact?'4px':'12px'}">${fields.map(fieldMarkup).join('')}</div><div class="section-caption">采购明细<span class="section-meta">示例明细 · 未税单价</span></div>${tableMarkup()}${totalMarkup()}${approvalMarkup()}<div class="note">${icon('info')}<span>交付说明：请随货附出厂检验报告及合格证；到货后由仓库核验数量与外观。</span></div><div class="drop-zone">${icon('plus')}拖拽左侧字段至此，扩展单据信息</div>`;}
else{canvas.innerHTML=`<div class="paper-company">${esc(documentConfig.printCompany)}</div><h2>${esc(documentConfig.name)}</h2><div class="paper-subtitle">${esc(documentConfig.code.toUpperCase())}</div><div class="paper-line"></div><div class="paper-meta" style="row-gap:${compact?'0':'4px'}">${fields.map(fieldMarkup).join('')}</div>${tableMarkup()}${totalMarkup()}<div class="uppercase-total">人民币大写：<strong>壹万肆仟捌佰陆拾壹元柒角陆分</strong></div><div class="paper-terms"><strong>交付与验收约定</strong><br>1. 请按订单所列规格交付，随货提供出厂检验报告及合格证。<br>2. 到货后以仓库实际验收数量为准；品质异常由双方协商处理。<br>3. 本订单采用人民币结算，增值税税率为 13%。</div><div class="signatures" ${documentConfig.printSignatures?'':'hidden'}><div>制单人：林晓<div class="signature-line"></div></div><div>采购审核：<div class="signature-line"></div></div><div>供应商确认：<div class="signature-line"></div></div></div><div class="paper-bottom"><span>${esc(documentConfig.category)}</span><span>${documentConfig.printTemplate==='compact'?'简洁版':'标准版'} / A4 纵向</span><span>第 1 页 / 共 1 页</span></div>`;}
$('#canvasLabel').textContent=documentConfig.name+(mode==='entry'?' / 默认录入布局':documentConfig.printTemplate==='compact'?' / 简洁套打模板':' / 标准套打模板');$('#canvasSize').textContent=mode==='entry'?'响应式 · 3 列栅格':'A4 · 210 × 297 mm';$('#modeCaption').textContent=mode==='entry'?'录入表单':'A4 套打画布';$('#canvasStats').textContent=`${fields.length} 个字段 · 两种视图同步`;$('#fieldCount').textContent=`已放置 ${fields.length} 个`;$('#undoButton').disabled=history.length===0;$('#statusSelection').textContent=selected?`已选择：${fields.find(f=>f.id===selected)?.label||'无'}`:'未选择字段';
canvas.querySelectorAll('[data-field]').forEach(node=>{node.addEventListener('click',()=>{if(!preview)selectField(node.dataset.field)});node.addEventListener('keydown',event=>{if(!preview&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selectField(node.dataset.field);}});});}
function renderLibrary(){const query=$('#fieldSearch').value.trim().toLowerCase();const source=library==='fields'?catalog:[{id:'customText',label:'单行文本',icon:'text',group:'常用控件'},{id:'customDate',label:'日期字段',icon:'calendar',group:'常用控件'},{id:'customNote',label:'备注文本',icon:'file',group:'常用控件'},{id:'customPerson',label:'人员字段',icon:'user',group:'常用控件'}];let group='';const filtered=source.filter(item=>`${item.label} ${item.id}`.toLowerCase().includes(query));$('#fieldList').innerHTML=filtered.map(item=>{let heading='';if(item.group!==group){group=item.group;heading=`<div class="group-heading">${esc(group)}<span>${source.filter(f=>f.group===group).length}</span></div>`;}const existing=fields.some(f=>f.id===item.id);return `${heading}<div class="field-item ${selected===item.id?'selected':''}" draggable="true" data-add="${esc(item.id)}"><span class="handle" aria-hidden="true">${icon('grip')}</span><span class="field-glyph">${icon(item.icon)}</span><span class="field-label" title="${esc(item.label)}">${esc(item.label)}</span>${existing?'<span class="in-use">已用</span>':''}<button aria-label="${existing?'选择':'添加'}${esc(item.label)}" title="${existing?'选择画布中的字段':'添加到画布'}">${icon(existing?'check':'plus')}</button></div>`;}).join('')||'<div class="empty-result">未找到匹配字段</div>';$('#fieldList').querySelectorAll('[data-add]').forEach(item=>{item.querySelector('button').addEventListener('click',()=>addField(item.dataset.add));item.addEventListener('dblclick',()=>addField(item.dataset.add));item.addEventListener('dragstart',event=>{if(preview){event.preventDefault();return;}event.dataTransfer.setData('text/plain',item.dataset.add);event.dataTransfer.effectAllowed='copy';});});}
function renderProperties(){document.querySelectorAll('[data-inspector]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.inspector===inspector)));$('#fieldPropertyTabs').hidden=inspector==='document';$('#properties').className='property-body'+(inspector==='document'?' doc-config':'');$('#inspectorTitle').textContent='设计设置';if(inspector==='document'){renderDocumentConfig();return;}const field=fields.find(item=>item.id===selected);if(!field){$('#properties').innerHTML='<div class="blank-message">点击画布上的字段，查看并编辑它的共享属性。</div>';$('#selectedType').textContent='未选择';return;}$('#selectedType').textContent=field.type;const identity=`<div class="property-identity"><span class="property-icon">${icon(field.icon)}</span><div><div class="property-name">${esc(field.label)}</div><div class="property-code mono">${esc(field.id)}</div></div></div>`;
if(propertyTab==='model'){$('#properties').innerHTML=`${identity}<div class="property-section" style="grid-column:1/-1"><h3>共享数据绑定</h3><div class="binding-box"><span class="mono">${esc(documentConfig.code)}.${esc(field.id)}</span><div class="binding-status">${icon('link')}录入 / 套打共同引用</div></div><p class="helper">下方为当前字段模型的实时快照。</p><pre class="model-code" id="modelCode"></pre></div>`;$('#modelCode').textContent=JSON.stringify({key:field.id,displayName:field.label,type:field.type,required:field.required,sampleValue:field.value},null,2);return;}
$('#properties').innerHTML=`${identity}<section class="property-section"><h3>基础属性</h3><div class="form-row"><label class="prop-label" for="propertyLabel">显示名称</label><input id="propertyLabel" maxlength="24" value="${esc(field.label)}"><p class="helper">修改后，录入与套打名称同步更新。</p></div><div class="form-row"><label class="prop-label" for="propertyValue">示例数据</label><input id="propertyValue" maxlength="100" value="${esc(field.value)}" ${field.id==='orderNo'?'readonly':''}>${field.id==='orderNo'?'<p class="helper">单据编号由右侧“单据配置 → 编号规则”生成。</p>':''}</div><div class="prop-meta"><span>字段类型</span><strong>${esc(field.type)}</strong></div></section><section class="property-section"><h3>布局与校验</h3><div class="form-row"><label class="prop-label" for="propertyWidth">占用列宽</label><select id="propertyWidth"><option value="normal" ${field.width==='normal'?'selected':''}>标准 · 1 列</option><option value="wide" ${field.width==='wide'?'selected':''}>宽字段 · 2 列</option></select></div><div class="prop-meta"><span>必填字段</span><label class="switch"><input id="propertyRequired" type="checkbox" ${field.required?'checked':''} aria-label="设为必填字段"><span id="requiredState">${field.required?'已开启':'已关闭'}</span></label></div></section><section class="property-section"><h3>数据绑定</h3><div class="binding-box"><span class="mono">${esc(documentConfig.code)}.${esc(field.id)}</span><div class="binding-status">${icon('check')}已关联共享字段模型</div></div><div class="prop-meta"><span>应用范围</span><strong>录入 + 套打</strong></div></section><div class="property-tip">${icon('info')}<span>同一字段，一处定义。此处修改会即时映射到两个设计视图。</span></div><button class="remove-btn" id="removeField">${icon('delete')}从单据移除字段</button>`;
function updateProperty(key,value){const current=fields.find(f=>f.id===selected);if(!current||current[key]===value)return;snapshot();current[key]=value;changed();renderCanvas();if(key==='label'){$('.property-name').textContent=value||'未命名字段';renderLibrary();}}
$('#propertyLabel').addEventListener('input',event=>updateProperty('label',event.target.value));$('#propertyValue').addEventListener('input',event=>updateProperty('value',event.target.value));$('#propertyWidth').addEventListener('change',event=>updateProperty('width',event.target.value));$('#propertyRequired').addEventListener('change',event=>{updateProperty('required',event.target.checked);$('#requiredState').textContent=event.target.checked?'已开启':'已关闭';});$('#removeField').addEventListener('click',()=>{const label=field.label;snapshot();fields=fields.filter(f=>f.id!==selected);selected=fields[0]?.id||null;changed();renderAll();notify(`已移除“${label}”，可点击撤销恢复。`);});}
function selectField(id){selected=id;inspector='field';renderCanvas();renderLibrary();renderProperties();}
function addField(id){if(preview)return;const exists=fields.find(f=>f.id===id);if(exists){selectField(id);notify(`“${exists.label}”已在画布中，已为你选中。`);return;}let field=catalog.find(f=>f.id===id);if(!field){const controls={customText:['自定义文本','请输入示例内容','单行文本','text'],customDate:['约定日期','2026-10-30','日期','calendar'],customNote:['补充说明','请在此填写补充说明。','多行文本','file'],customPerson:['经办人员','王明','人员选择','user']};if(!controls[id])return;const [label,value,type,glyph]=controls[id];field={id:`custom_${customSerial++}`,label,value,type,icon:glyph,required:false,width:id==='customNote'?'wide':'normal'};}snapshot();fields.push(clone(field));selected=field.id;inspector='field';changed();renderAll();notify(`已添加“${field.label}”，录入与套打已同步。`);const node=$('#canvas').querySelector(`[data-field="${field.id}"]`);node?.scrollIntoView({block:'nearest',behavior:'auto'});}
function renderAll(){renderCanvas();renderLibrary();renderProperties();}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderCanvas();$('#canvasScroll').scrollTop=0;}));
document.querySelectorAll('[data-library]').forEach(button=>button.addEventListener('click',()=>{library=button.dataset.library;document.querySelectorAll('[data-library]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderLibrary();}));
document.querySelectorAll('[data-property]').forEach(button=>button.addEventListener('click',()=>{propertyTab=button.dataset.property;document.querySelectorAll('[data-property]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderProperties();}));
function togglePreview(){preview=!preview;$('#app').classList.toggle('preview',preview);$('#previewButton').setAttribute('aria-pressed',String(preview));$('#previewButton span').textContent=preview?'返回编辑':'预览';renderCanvas();if(preview)notify('正在预览示例单据，选择框与编辑边界已隐藏。');}
$('#previewButton').addEventListener('click',togglePreview);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&preview)togglePreview();});
$('#saveButton').addEventListener('click',()=>{notify('仅演示：草稿已在本次内存会话中标记保存，刷新页面后恢复示例。');$('#editState').textContent='演示草稿已保存 · 仅本次会话';});
$('#undoButton').addEventListener('click',()=>{if(!history.length)return;const previous=history.pop();fields=previous.fields;selected=previous.selected;documentConfig=clone(previous.documentConfig);changed();renderAll();notify('已撤销上一次修改，单据配置和字段均已恢复。');});
$('#resetButton').addEventListener('click',()=>{snapshot();fields=clone(catalog.slice(0,8));documentConfig=clone(initialDocument);selected='supplier';changed();renderAll();notify('已恢复示例采购订单，可撤销本次重置。');});
$('#fieldSearch').addEventListener('input',renderLibrary);$('#canvasDensity').addEventListener('change',renderCanvas);
const canvas=$('#canvas');canvas.addEventListener('dragover',event=>{if(preview)return;event.preventDefault();event.dataTransfer.dropEffect='copy';canvas.classList.add('drag-over');});canvas.addEventListener('dragleave',event=>{if(!canvas.contains(event.relatedTarget))canvas.classList.remove('drag-over');});canvas.addEventListener('drop',event=>{event.preventDefault();canvas.classList.remove('drag-over');addField(event.dataTransfer.getData('text/plain'));});document.addEventListener('dragend',()=>canvas.classList.remove('drag-over'));

function configSection(key,title,number,content){return `<details class="config-section" data-section="${key}" ${sectionState[key]?'open':''}><summary><span class="config-number">${number}</span>${title}</summary><div class="config-fields">${content}</div></details>`;}
function configSelect(id,label,values,current){return `<div><label for="${id}">${label}</label><select id="${id}">${values.map(([value,text])=>`<option value="${value}" ${String(current)===String(value)?'selected':''}>${text}</option>`).join('')}</select></div>`;}
function renderDocumentConfig(){
 $('#selectedType').textContent='作用于整张单据';
 const cfg=documentConfig;
 $('#properties').innerHTML=`<div class="config-intro"><strong>${icon('file')}单据配置</strong><p>定义整张单据的业务行为。字段选中后可切回属性编辑，配置始终保留。</p></div>`+
 configSection('basic','基础信息','01',`<div><label for="docName">单据名称 <span class="required">*</span></label><input id="docName" maxlength="24" value="${esc(cfg.name)}"></div><div><label for="docCode">单据标识 <span class="required">*</span></label><input id="docCode" class="mono" maxlength="40" value="${esc(cfg.code)}" spellcheck="false"><p class="config-help">小写字母开头，可含数字与下划线。</p></div>${configSelect('docCategory','业务分类',[['采购管理','采购管理'],['销售管理','销售管理'],['库存管理','库存管理'],['通用单据','通用单据']],cfg.category)}<div class="config-errors" id="basicError" role="status"></div>`)+
 configSection('number','编号规则','02',`<div class="config-pair"><div><label for="docPrefix">编号前缀</label><input id="docPrefix" class="mono" maxlength="10" value="${esc(cfg.prefix)}" spellcheck="false"></div>${configSelect('docSerialLength','流水号位数',[[3,'3 位'],[4,'4 位'],[5,'5 位'],[6,'6 位']],cfg.serialLength)}</div>${configSelect('docDateFormat','日期部分',[['YYYYMMDD','年月日 · YYYYMMDD'],['YYYYMM','年月 · YYYYMM'],['none','不包含日期']],cfg.dateFormat)}<div class="config-example"><span>编号示例 · 单号字段同步更新</span><strong id="numberExample">${esc(numberExample())}</strong></div><div class="config-errors" id="numberError" role="status"></div>`)+
 configSection('operations','启用业务操作','03',`<div class="operation-grid">${operationOptions.map(([key,label])=>`<label class="operation-choice"><input type="checkbox" data-operation="${key}" ${cfg.operations.includes(key)?'checked':''}><span>${label}</span></label>`).join('')}</div><p class="config-help">勾选项同步显示在录入页操作栏。这里只预览配置，不执行真实业务操作。</p>`)+
 configSection('approval','审批设置','04',`${configSelect('docApproval','审批方式',[['none','无需审核 · 提交即生效'],['single','单级审核'],['multi','两级审核']],cfg.approval)}<div id="reviewerSettings" ${cfg.approval==='none'?'hidden':''}>${configSelect('docReviewer','第一审核角色',[['采购主管','采购主管'],['部门主管','部门主管'],['财务主管','财务主管']],cfg.reviewer)}<p id="approvalNote" class="config-help">${cfg.approval==='multi'?'第二级为部门负责人。':'审核通过后标记为已审核。'}</p></div><p class="config-help">选择审批方式时自动补齐提交与审核相关操作；无需审核时停用审核、反审。</p>`)+
 configSection('print','打印设置','05',`${configSelect('docPrintTemplate','默认模板',[['standard','标准模板 · 完整条款'],['compact','简洁模板 · 精简条款']],cfg.printTemplate)}<div><label for="docPrintCompany">打印抬头</label><input id="docPrintCompany" maxlength="40" value="${esc(cfg.printCompany)}"></div><div class="config-toggle"><label for="docPrintSignatures">显示签字区域</label><input type="checkbox" id="docPrintSignatures" ${cfg.printSignatures?'checked':''}></div><button class="btn" id="viewPrintConfig">${icon('print')}查看套打效果</button><p class="config-help">使用 A4 纵向示例纸张；模板切换会改变条款及页尾呈现。</p>`)+
 `<div class="config-bottom">${icon('info')}<span>配置仅保留在当前演示会话。支持顶部保存草稿、撤销和重置。</span></div>`;
 $('#properties').querySelectorAll('details').forEach(el=>el.addEventListener('toggle',()=>{sectionState[el.dataset.section]=el.open}));
 const textRules=[['docName','name',v=>!!v.trim(),'请填写单据名称。','basicError'],['docCode','code',v=>/^[a-z][a-z0-9_]{0,39}$/.test(v),'单据标识须以小写字母开头，只能包含小写字母、数字、下划线。','basicError'],['docPrefix','prefix',v=>/^[A-Za-z0-9]{1,10}$/.test(v),'前缀须为 1–10 位字母或数字。','numberError'],['docPrintCompany','printCompany',v=>!!v.trim(),'请填写打印抬头。','basicError']];
 for(const [id,key,valid,error,errorId] of textRules){const input=$('#'+id);input.addEventListener('focus',()=>{input.dataset.undoStarted=''});input.addEventListener('input',()=>{if(!valid(input.value)){input.setAttribute('aria-invalid','true');$('#'+errorId).textContent=error;return;}input.removeAttribute('aria-invalid');$('#'+errorId).textContent='';if(!input.dataset.undoStarted){snapshot();input.dataset.undoStarted='1';}documentConfig[key]=input.value.trim();applyDocumentConfig();});input.addEventListener('blur',()=>{if(!valid(input.value)){input.value=documentConfig[key];input.removeAttribute('aria-invalid');$('#'+errorId).textContent='';notify('输入无效，已保留上一次有效配置。');}input.dataset.undoStarted='';});}
 for(const [id,key] of [['docCategory','category'],['docDateFormat','dateFormat'],['docSerialLength','serialLength'],['docReviewer','reviewer'],['docPrintTemplate','printTemplate']])$('#'+id).addEventListener('change',e=>{snapshot();documentConfig[key]=key==='serialLength'?Number(e.target.value):e.target.value;applyDocumentConfig();});
 $('#docApproval').addEventListener('change',e=>{snapshot();documentConfig.approval=e.target.value;const set=new Set(documentConfig.operations);set.add('submit');if(e.target.value==='none'){set.delete('approve');set.delete('unapprove');}else{for(const op of ['approve','unapprove','withdraw'])set.add(op);}documentConfig.operations=[...set];$('#reviewerSettings').hidden=e.target.value==='none';$('#approvalNote').textContent=e.target.value==='multi'?'第二级为部门负责人。':'审核通过后标记为已审核。';refreshOperationChecks();applyDocumentConfig();});
 $('#properties').querySelectorAll('[data-operation]').forEach(input=>input.addEventListener('change',()=>{const key=input.dataset.operation;if(documentConfig.approval!=='none'&&['approve','submit'].includes(key)&&!input.checked){input.checked=true;notify('当前审批方式需要提交与审核，请先在审批设置中调整。');return;}if(documentConfig.approval==='none'&&['approve','unapprove'].includes(key)&&input.checked){input.checked=false;notify('请先在审批设置中启用审核。');return;}snapshot();const set=new Set(documentConfig.operations);input.checked?set.add(key):set.delete(key);documentConfig.operations=[...set];applyDocumentConfig();}));
 $('#docPrintSignatures').addEventListener('change',e=>{snapshot();documentConfig.printSignatures=e.target.checked;applyDocumentConfig();});
 $('#viewPrintConfig').addEventListener('click',()=>{mode='print';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode==='print')));renderCanvas();$('#canvasScroll').scrollTop=0;notify('已切换到套打视图，单据配置仍可继续调整。');});
}
function refreshOperationChecks(){document.querySelectorAll('[data-operation]').forEach(el=>el.checked=documentConfig.operations.includes(el.dataset.operation));}
function applyDocumentConfig(){changed();renderCanvas();const example=$('#numberExample');if(example)example.textContent=numberExample();}
document.querySelectorAll('[data-inspector]').forEach(button=>button.addEventListener('click',()=>{inspector=button.dataset.inspector;renderProperties();}));

renderAll();
</script>
</body>
</html>
