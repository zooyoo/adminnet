const variants={A:{file:'classic',name:'经典三栏',en:'STRUCTURED WORKSPACE',desc:'已选方案。右侧切换字段属性与单据配置，支持名称、编号、操作、审批和打印设置联动。'},B:{file:'studio',name:'沉浸画布',en:'CANVAS FIRST',desc:'让出更多空间给纸张与设计。面板按需展开，更适合精细套打、尺寸调整和版面工作。'},C:{file:'linked',name:'双屏联动',en:'CONNECTED VIEWS',desc:'录入和打印同时可见。选中同一个字段，直接看到两种呈现，最直观地理解一体化设计。'}};
let current='A';
const frames={};
const stage=document.getElementById('stage');
function shortcut(e){if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey)return;const t=e.target;if(t?.closest?.('input,textarea,select,button,[role="button"],[contenteditable="true"]'))return;if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}else if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}}
function select(key,writeUrl=true){if(!variants[key])key='A';current=key;if(!frames[key]){const frame=document.createElement('iframe');frame.title=variants[key].name+'工作台原型';frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-modals allow-downloads');frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(documents[variants[key].file]),c=>c.charCodeAt(0)));frame.addEventListener('load',()=>{try{frame.contentDocument.addEventListener('keydown',shortcut)}catch{}});frames[key]=frame;stage.append(frame)}for(const [k,f]of Object.entries(frames))f.hidden=k!==key;document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));document.getElementById('live').textContent='当前方案 '+key+'：'+variants[key].name;document.title=key+' · '+variants[key].name+' | 单据设计工作台';if(writeUrl){try{const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState({},'',url)}catch{}}}
function cycle(delta){const keys=Object.keys(variants);select(keys[(keys.indexOf(current)+delta+keys.length)%keys.length])}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>select(b.dataset.key)));
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);
const modal=document.getElementById('overviewDialog');
function closeOverview(){modal.hidden=true;document.getElementById('showOverview').focus()}
document.getElementById('showOverview').onclick=()=>{modal.hidden=false;document.getElementById('closeOverview').focus()};document.getElementById('closeOverview').onclick=closeOverview;
modal.addEventListener('click',e=>{if(e.target===modal)closeOverview()});
modal.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverview();return}if(e.key==='Tab'){const items=[...modal.querySelectorAll('button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const cards=document.getElementById('cards');for(const [key,v]of Object.entries(variants)){const article=document.createElement('article');article.className='card';if(thumbs[v.file]){const img=document.createElement('img');img.src=thumbs[v.file];img.alt=v.name+'工作台界面截图';article.append(img)}else{const fallback=document.createElement('div');fallback.className='fallback-thumb';fallback.textContent=key;article.append(fallback)}const info=document.createElement('div');info.className='card-info';const tag=document.createElement('div');tag.className='card-tag';tag.textContent=v.en;const h=document.createElement('h2');h.textContent=key+' / '+v.name;const p=document.createElement('p');p.textContent=v.desc;const b=document.createElement('button');b.textContent='打开方案 '+key;b.onclick=()=>{closeOverview();select(key)};info.append(tag,h,p,b);article.append(info);cards.append(article)}
window.addEventListener('keydown',e=>{if(modal.hidden)shortcut(e)});window.addEventListener('popstate',()=>select(new URLSearchParams(location.search).get('variant')||'A',false));
select((new URLSearchParams(location.search).get('variant')||'A').toUpperCase());
