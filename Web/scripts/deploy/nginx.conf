worker_processes 1;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name localhost;
        charset utf-8;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        # HTML 与可部署后修改的运行时配置不缓存，版本资源按内容哈希缓存。
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
        location ~ ^/_app-config(?:-[^/]+)?\.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }
        location ~* "^/(?:assets|js|css|fonts)/.*-[a-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|svg|webp)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        # 只移除一次 /prod-api；业务 /api、上传文件和 Hub 路径保持原样。
        location ^~ /prod-api/ {
            proxy_pass http://adminNet:5005/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Cache-Control "no-store" always;
        }

        # Sundial.Dashboard 使用独立根路径，保留其资源、API 与事件流。
        location ^~ /schedule {
            proxy_pass http://adminNet:5005;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header Cache-Control "no-store" always;
        }

    }
}
